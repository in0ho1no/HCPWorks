   id="svg4"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1">
    <style
       type="text/css"
       id="style1">
      /* 背景色 */
      .bg-rect { fill: #EFC33A; }
      
      /* 線 */
      .link {
        stroke: #204A87;
        stroke-width: 60;
        stroke-linecap: round;
      }
      
      /* 円 */
      .node {
        fill: #FFFFFF;
        stroke: #204A87;
        stroke-width: 60;
      }
    </style>
  </defs>
  <rect
     class="bg-rect"
     x="32"
     y="32"
     width="928"
     height="928"
     rx="80"
     ry="80"
     id="rect1" />
  <!-- 接続線 -->
  <path
