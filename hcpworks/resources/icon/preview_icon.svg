     d="M 550 110 L 550 400"
     id="path1" />
  <path
     class="link"
     d="M 550 400 L 700 400"
     id="path2" />
  <path
     class="link"
     d="M 710 400 L 710 710"
     id="path3" />
  <!-- 円 -->
  <circle
     class="node"
     cx="280"
     cy="280"
     r="180"
     id="circle3" />
  <circle
     class="node"
     cx="710"
