<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" shape-rendering="geometricPrecision">
  <defs>
    <style type="text/css">
      /* 背景色 */
      .bg-rect { fill: #EFC33A; }
      
      /* 線 */
      .link {
        stroke: #204A87;
        stroke-width: 60;
        stroke-linecap: round;
      }
      
      /* 円 */
      .node {
        fill: #FFFFFF;
        stroke: #204A87;
        stroke-width: 60;
      }
    </style>
  </defs>

  <rect class="bg-rect" x="32" y="32" width="928" height="928" rx="80" ry="80" />

  <!-- 接続線 -->
  <path class="link" d="M 550 110 L 550 400" />
  <path class="link" d="M 550 400 L 700 400" />
  <path class="link" d="M 710 400 L 710 710" />

  <!-- 円 -->
  <circle class="node" cx="280" cy="280" r="180" />
  <circle class="node" cx="710" cy="710" r="180" />
</svg>
