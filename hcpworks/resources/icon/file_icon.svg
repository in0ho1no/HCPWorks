<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style type="text/css">
      /* 背景色：視認性の高い鮮やかなイエロー */
      .bg-rect { fill: #FFD700; }
      
      /* 文字色：黄色に映える深みのあるブルー（太字） */
      .text-char { 
        font-family: 'Arial-BoldMT', 'Arial', sans-serif; 
        font-weight: 900; 
        fill: #003399; 
      }
    </style>
  </defs>

  <rect class="bg-rect" x="64" y="64" width="896" height="896" rx="100" ry="100" />

  <text x="100" y="570" class="text-char" font-size="600">H</text>

  <text x="520" y="900" class="text-char" font-size="500">C</text>
</svg>
