# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:15"
      timezone: "Asia/Tokyo"
    cooldown: 
      default-days: 7
    open-pull-requests-limit: 10
    assignees:
      - "in0ho1no"
    labels:
      - "dependencies"
    commit-message:
      prefix: "github-actions"
      include: "scope"
    target-branch: "develop"

  - package-ecosystem: "npm"
    directory: "/hcpworks/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:15"
      timezone: "Asia/Tokyo"
    cooldown: 
      default-days: 7
    open-pull-requests-limit: 10
    assignees:
      - "in0ho1no"
    labels:
      - "dependencies"
    commit-message:
      prefix: "npm"
      include: "scope"
    target-branch: "develop"
    ignore:
      # @types/vscode のバージョンは「サポートする最低 VS Code バージョン」の宣言そのもの。
      # engines.vscode より新しいと vsce package が失敗する。
      # 型定義のみで脆弱性を持ちうるコードが存在しないため、自動更新の対象外とする。
      # 最低サポートバージョンを引き上げるときは engines.vscode と併せて手動で更新すること。
      - dependency-name: "@types/vscode"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:15"
      timezone: "Asia/Tokyo"
    cooldown: 
      default-days: 7
    assignees:
      - "in0ho1no"
    labels:
      - "dependencies"
    commit-message:
      prefix: "docker"
      include: "scope"
    target-branch: "develop"
