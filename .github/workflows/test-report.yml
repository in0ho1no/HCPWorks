name: Test Report

on:
  workflow_run:
    workflows: ["VSCode Extension Test"]
    types:
      - completed

permissions:
  checks: write
  actions: read  # artifact のダウンロードに必要

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: test-results
          name: Mocha Tests
          path: '**/*.xml'
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: false
