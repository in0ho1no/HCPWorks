name: バグ報告
description: 不具合を報告します
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        不具合の報告ありがとうございます。以下の項目をできるだけ詳しく記入してください。

  - type: textarea
    id: what-happened
    attributes:
      label: 現象
      description: 何が起きたかを記述してください。
      placeholder: 例) 保存ボタンを押してもファイルが作成されない
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どうなるべきかを記述してください。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 不具合を再現するための手順を番号付きで記述してください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: バージョン
      description: 使用しているバージョン(わかる場合)を記入してください。
      placeholder: 例) 1.0.0
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - その他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット
      description: 関連するログやスクリーンショットがあれば貼り付けてください。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueを検索し、重複がないことを確認しました
          required: true
